services:
  # ── Entrata Training Hub (entrata-training.onrender.com) ─────────────────────
  - type: web
    name: entrata-training
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ACCESS_PINS
        value: 4829,7392,1568,9047,3215,6784,2931,8456,5103,7620
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        sync: false
    disk:
      name: training-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

  # ── MYK Super Agent (SA.Mykbrands.com) ───────────────────────────────────────
  - type: web
    name: myk-super-agent
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SA_ONLY_MODE
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: SA_PIN
        sync: false
      - key: OLLAMA_URL
        sync: false
      - key: APPLE_AI_URL
        sync: false
    disk:
      name: super-agent-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
