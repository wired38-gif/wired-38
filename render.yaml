services:
  # ── Entrata Training Hub ──────────────────────────────────────────────────────
  # Serves: Entrata training simulator, TheOptimizer, Queen AI chat
  # Branch: main
  # URL: entrata-training.onrender.com (add custom domain in Render dashboard)
  - type: web
    name: entrata-training
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ACCESS_PINS
        value: 4829,7392,1568,9047,3215,6784,2931,8456,5103,7620
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        sync: false
    disk:
      name: training-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

  # ── MYK Super Agent (SA.Mykbrands.com) ───────────────────────────────────────
  # Serves: Super Agent ONLY — no Entrata code
  # Branch: super-agent-standalone (NOT main)
  # URL: myk-super-agent-1.onrender.com → SA.Mykbrands.com
  # NOTE: This service is deployed from the super-agent-standalone branch.
  #       Render connects to that branch separately — this entry is for reference only.
  - type: web
    name: myk-super-agent
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/server.cjs
    branch: super-agent-standalone
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: SA_PIN
        sync: false
      - key: OLLAMA_URL
        sync: false
      - key: APPLE_AI_URL
        sync: false
    disk:
      name: super-agent-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
