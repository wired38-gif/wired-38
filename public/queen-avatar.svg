<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <clipPath id="circle">
      <circle cx="60" cy="60" r="58"/>
    </clipPath>
    <radialGradient id="bgGrad" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#e91e8c"/>
      <stop offset="100%" stop-color="#8b0057"/>
    </radialGradient>
    <radialGradient id="skinGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f8d5bb"/>
      <stop offset="100%" stop-color="#e8b899"/>
    </radialGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a84b"/>
      <stop offset="50%" stop-color="#c99a3e"/>
      <stop offset="100%" stop-color="#a07830"/>
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2d2d2d"/>
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#f0a500"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="60" cy="60" r="60" fill="url(#bgGrad)"/>

  <!-- Body / Jacket -->
  <ellipse cx="60" cy="108" rx="38" ry="22" fill="url(#jacketGrad)" clip-path="url(#circle)"/>
  <rect x="22" y="88" width="76" height="35" fill="url(#jacketGrad)" clip-path="url(#circle)"/>
  <!-- Jacket lapels -->
  <path d="M60,88 L42,98 L48,120 Z" fill="#111" clip-path="url(#circle)"/>
  <path d="M60,88 L78,98 L72,120 Z" fill="#111" clip-path="url(#circle)"/>

  <!-- Neck -->
  <rect x="52" y="75" width="16" height="16" rx="3" fill="url(#skinGrad)"/>

  <!-- Hair  back layer -->
  <ellipse cx="60" cy="54" rx="30" ry="32" fill="url(#hairGrad)"/>
  <!-- Hair sides hanging down -->
  <rect x="30" y="55" width="13" height="28" rx="6" fill="url(#hairGrad)"/>
  <rect x="77" y="55" width="13" height="28" rx="6" fill="url(#hairGrad)"/>

  <!-- Face -->
  <ellipse cx="60" cy="58" rx="22" ry="25" fill="url(#skinGrad)"/>

  <!-- Hair  front top -->
  <ellipse cx="60" cy="38" rx="22" ry="10" fill="#d4a84b"/>
  <path d="M38,38 Q45,28 60,33 Q75,28 82,38 Q78,32 60,30 Q42,32 38,38 Z" fill="#c99a3e"/>

  <!-- Eyebrows -->
  <path d="M46,49 Q51,46 56,48" stroke="#8b6914" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M64,48 Q69,46 74,49" stroke="#8b6914" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="51" cy="54" rx="5" ry="3.5" fill="white"/>
  <ellipse cx="69" cy="54" rx="5" ry="3.5" fill="white"/>
  <ellipse cx="51" cy="54.5" rx="3" ry="2.8" fill="#5a7fa0"/>
  <ellipse cx="69" cy="54.5" rx="3" ry="2.8" fill="#5a7fa0"/>
  <circle cx="51" cy="54.5" r="1.8" fill="#2a4060"/>
  <circle cx="69" cy="54.5" r="1.8" fill="#2a4060"/>
  <!-- Eye sparkles -->
  <circle cx="52.5" cy="53.2" r="0.8" fill="white"/>
  <circle cx="70.5" cy="53.2" r="0.8" fill="white"/>
  <!-- Lashes -->
  <path d="M46,51 Q51,49 56,51" stroke="#333" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M64,51 Q69,49 74,51" stroke="#333" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M57,61 Q60,64 63,61" stroke="#d4956a" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Lips -->
  <path d="M51,69 Q56,66 60,67 Q64,66 69,69 Q64,73 60,73 Q56,73 51,69 Z" fill="#e91e8c"/>
  <path d="M51,69 Q56,67 60,68 Q64,67 69,69" stroke="#c2185b" stroke-width="0.5" fill="none"/>
  <!-- Cupid's bow -->
  <path d="M53,69 Q57,66 60,67 Q63,66 67,69" fill="#f06292"/>

  <!-- Blush -->
  <ellipse cx="44" cy="63" rx="6" ry="3" fill="rgba(233,30,140,0.2)"/>
  <ellipse cx="76" cy="63" rx="6" ry="3" fill="rgba(233,30,140,0.2)"/>

  <!-- Earrings  left -->
  <ellipse cx="36" cy="64" rx="4" ry="5.5" fill="#d63384"/>
  <ellipse cx="36" cy="62" rx="2.5" ry="2.5" fill="#ff4da6"/>
  <ellipse cx="36" cy="68" rx="2" ry="2" fill="#b5004e"/>
  <!-- Earrings  right -->
  <ellipse cx="84" cy="64" rx="4" ry="5.5" fill="#d63384"/>
  <ellipse cx="84" cy="62" rx="2.5" ry="2.5" fill="#ff4da6"/>
  <ellipse cx="84" cy="68" rx="2" ry="2" fill="#b5004e"/>

  <!-- Crown base -->
  <rect x="40" y="28" width="40" height="10" rx="2" fill="url(#crownGrad)"/>
  <!-- Crown points -->
  <polygon points="42,28 46,14 50,28" fill="url(#crownGrad)"/>
  <polygon points="53,28 60,10 67,28" fill="url(#crownGrad)"/>
  <polygon points="70,28 74,14 78,28" fill="url(#crownGrad)"/>
  <!-- Crown gems -->
  <ellipse cx="46" cy="14" rx="4" ry="4.5" fill="#ff1493"/>
  <ellipse cx="46" cy="14" rx="2.5" ry="3" fill="#ff69b4"/>
  <ellipse cx="60" cy="10" rx="4.5" ry="5" fill="#ff1493"/>
  <ellipse cx="60" cy="10" rx="3" ry="3.5" fill="#ff69b4"/>
  <ellipse cx="74" cy="14" rx="4" ry="4.5" fill="#ff1493"/>
  <ellipse cx="74" cy="14" rx="2.5" ry="3" fill="#ff69b4"/>
  <!-- Crown small gems on base -->
  <circle cx="50" cy="33" r="2" fill="#ffd700"/>
  <circle cx="60" cy="31" r="2.5" fill="#ff1493"/>
  <circle cx="70" cy="33" r="2" fill="#ffd700"/>

  <!-- Hand with ring hint at bottom -->
  <circle cx="60" cy="118" r="6" fill="url(#skinGrad)" clip-path="url(#circle)"/>
  <!-- Pink ring on finger -->
  <rect x="57" y="114" width="6" height="4" rx="2" fill="#d63384" clip-path="url(#circle)"/>

  <!-- Outline ring on circle -->
  <circle cx="60" cy="60" r="58" fill="none" stroke="rgba(255,215,0,0.3)" stroke-width="2"/>
</svg>
